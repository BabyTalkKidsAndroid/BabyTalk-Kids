name: Build BabyTalk Kids APK

on:
  workflow_dispatch:
  push:
    paths:
      - BabyTalk_Kids_Android_Starter_FULL_MVP.zip
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q BabyTalk_Kids_Android_Starter_FULL_MVP.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BabyTalk-Kids-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
